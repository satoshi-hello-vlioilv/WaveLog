<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>測定伝送システム — 起動中</title>
<!--
  デスクトップ版の起動画面（exe に入る・§9.544）。アプリ内の起動の覆い（#appBoot・95-boot.css）と
  **同じ色・同じ地**——トークンと地の指定は写してあり、tests/test_boot.py が一致を見張る。
  進み具合は窓（Rust）が確かめた事実だけで言う: ① Python を探す ② アプリの中身を起こす ③ 画面を開く。
  窓が splash.step(id, state, detail) / splash.fail(title, detail) を呼ぶ。
-->
<style>
 :root{
  --nav:#173842; --teal:#087c89; --teal-dark:#096b75; --teal-soft:#9cd6ce;
  --pale:#dcecef; --bg:#eef2f4; --line:#b7c7cc; --track:#e3ebee;
  --ink:#173842; --ink-3:#4a6169; --ink-soft:#7b8e95;
  --warn:#f5a30a; --warn-fg:#7a2f00; --warn-bg:#fff0d6; --warn-line:#d58d16;
  --danger:#a32424; --danger-bg:#fdeaea; --danger-line:#e0a3a3;
 }
 *{box-sizing:border-box}
 html,body{height:100%}
 body{
  margin:0; display:flex; align-items:center; justify-content:center;
  color:var(--pale);
  background:
   radial-gradient(120% 90% at 12% -10%, color-mix(in srgb, var(--teal) 10%, transparent), transparent 58%),
   radial-gradient(90% 80% at 108% 108%, color-mix(in srgb, var(--warn) 6%, transparent), transparent 55%),
   linear-gradient(158deg,
    color-mix(in srgb, var(--nav) 60%, black) 0%,
    color-mix(in srgb, var(--nav) 88%, black) 46%,
    color-mix(in srgb, var(--nav) 48%, black) 100%);
  font-family:"Yu Gothic UI","Meiryo","Segoe UI",system-ui,sans-serif;
  font-size:14px; line-height:1.6;
 }
 .card{width:min(94vw,600px);border-radius:18px;overflow:hidden;background:#fff;border:1px solid var(--line);
  box-shadow:0 18px 44px rgba(23,56,66,.18),0 3px 8px rgba(23,56,66,.10);color:var(--ink)}
 .head{padding:20px 24px 14px;border-bottom:1px solid var(--track)}
 .head b{display:block;font-size:18px}
 .head span{color:var(--ink-3);font-size:13px}
 ol{list-style:none;margin:0;padding:8px 24px 6px}
 li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--track)}
 li:first-child{border-top:0}
 .mark{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center;
  font-size:11px;font-weight:800;color:#fff}
 .t{font-weight:700}
 .d{display:block;color:var(--ink-3);font-size:12.5px;word-break:break-all}
 .when{font:11.5px Consolas,monospace;color:var(--ink-soft);padding-top:3px}
 li.wait{color:var(--ink-soft)}
 li.now .mark{border-color:var(--teal);border-top-color:transparent;animation:spin .9s linear infinite}
 li.ok .mark{background:var(--teal);border-color:var(--teal)}
 li.ok .mark::after{content:"✓"}
 li.warn .mark{background:var(--warn);border-color:var(--warn);color:var(--warn-fg)}
 li.warn .mark::after{content:"!"}
 li.bad .mark{background:var(--danger);border-color:var(--danger)}
 li.bad .mark::after{content:"×"}
 @keyframes spin{to{transform:rotate(360deg)}}
 @media (prefers-reduced-motion:reduce){li.now .mark{animation:none}}
 .fail{margin:0 24px 16px;padding:12px 14px;border-radius:10px;background:var(--danger-bg);border:1px solid var(--danger-line);
  color:var(--danger);font-size:12.5px;line-height:1.7}
 .fail pre{white-space:pre-wrap;margin:6px 0 0;font:12px Consolas,monospace;max-height:220px;overflow:auto;color:var(--ink)}
 .foot{display:flex;justify-content:space-between;padding:10px 24px 16px;color:var(--ink-3);font-size:12.5px}
 .hidden{display:none}
</style>
</head>
<body>
<section class="card" aria-labelledby="title">
  <div class="head"><b id="title">測定伝送システムを起動しています</b><span id="lead">準備ができたら、この窓がそのままアプリに切り替わります。</span></div>
  <ol>
    <li class="now" id="s-update"><span class="mark"></span><span><span class="t">版をそろえる</span><span class="d">共有の置き場の「配る版」と同じか確かめます</span></span><span class="when"></span></li>
    <li class="wait" id="s-python"><span class="mark"></span><span><span class="t">Python を探す</span><span class="d">PATH で最初に見つかる Python（update.bat と同じ）</span></span><span class="when"></span></li>
    <li class="wait" id="s-backend"><span class="mark"></span><span><span class="t">アプリの中身を起こす</span><span class="d">画面と共有DB（ポートは使いません）</span></span><span class="when"></span></li>
    <li class="wait" id="s-open"><span class="mark"></span><span><span class="t">画面を開く</span><span class="d"></span></span><span class="when"></span></li>
  </ol>
  <div class="fail hidden" id="fail" role="alert"></div>
  <div class="foot"><span>デスクトップ版</span><span id="elapsed">0.0 秒</span></div>
</section>
<script>
(() => {
  const t0 = performance.now();
  const $ = (s) => document.querySelector(s);
  const sec = () => ((performance.now() - t0) / 1000).toFixed(1);
  const timer = setInterval(() => { $("#elapsed").textContent = sec() + " 秒"; }, 100);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  /* よくある理由 → 次にすること（理由の文から見分ける。当てはまらなければ理由だけ出す） */
  const HINTS = [
    [/No module named '?flask/i, "Python に Flask が入っていません。program フォルダの update.bat を1回実行してから、開き直してください。"],
    [/No module named/i, "Python に必要な部品が入っていません。program フォルダの update.bat を1回実行してください。"],
    [/Python が見つかりません/, "Python を入れて PATH に通してから、開き直してください。分からなければ管理者に連絡してください。"],
    [/program フォルダ|sidecar\.py/, "exe を直接開かず、アプリのフォルダの Start.vbs（またはデスクトップの起動アイコン）から起動してください（exe だけではアプリの中身の場所が分かりません）。"],
    [/版が食い違/, "アプリが更新されています。この窓を閉じて、デスクトップの起動アイコンから開き直してください。"],
    [/秒たっても準備できません/, "PC が混んでいるか、共有フォルダへの接続で止まっています。少し待ってから開き直してください。"],
  ];
  window.splash = {
    step(id, state, detail) {
      const li = $("#s-" + id); if (!li) return;
      li.className = state;
      if (detail) li.querySelector(".d").textContent = detail;
      li.querySelector(".when").textContent = sec() + "s";
      const next = li.nextElementSibling;
      if (state === "ok" && next && next.classList.contains("wait")) next.className = "now";
    },
    fail(title, detail) {
      clearInterval(timer);
      $("#elapsed").textContent = sec() + " 秒";
      $("#title").textContent = title;
      $("#lead").textContent = "下の理由を確かめてください。直したら、この窓を閉じて起動アイコンから開き直してください。";
      document.querySelectorAll("li.now").forEach((li) => (li.className = "bad"));
      const hint = HINTS.find(([re]) => re.test(detail));
      const box = $("#fail");
      box.innerHTML = (hint ? "<b>次にすること</b><div>" + hint[1] + "</div>" : "") + "<b>理由</b><pre>" + esc(detail) + "</pre>";
      box.classList.remove("hidden");
    },
  };
})();
</script>
</body>
</html>
