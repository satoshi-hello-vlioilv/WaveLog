<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>測定伝送システム — 起動中</title>
<!--
  デスクトップ版の起動画面（exe に入る・§9.544）。アプリ内の起動の覆い（#appBoot・95-boot.css）と
  **同じ分割カード・同じ4段・同じ色・同じ地**（§9.580）——窓から覆いへ切り替わっても、左のブランドと右の段の
  並びがそのまま続いて見える。トークンと地の指定は写してあり、段の名前は backend/boot_status.py の PHASES と同じ
  （tests/test_boot.py が一致を見張る）。窓（Rust）は splash.step(id, state, detail) / splash.fail(title, detail) を呼ぶ。
  窓の段（update・python・backend・open）は見せる段へ寄せる: update→版をそろえる（上げる／戻すは見出しが言う・§9.606）／python・backend→アプリを起こす／
  open→画面を組み立てる。窓の段の細かな字（Python の場所など）は段の title に残し、画面には「いま」と注意だけ出す。
-->
<style>
 :root{
  --nav:#173842; --teal:#087c89; --teal-dark:#096b75; --teal-soft:#9cd6ce; --teal-ink:#075e67;
  --pale:#dcecef; --bg:#eef2f4; --line:#b7c7cc; --surface-3:#e3ebee;
  --ink:#17272d; --ink-2:#3a565d; --muted:#60747b;
  --warn:#f5a30a; --warn-fg:#7a2f00; --warn-bg:#fff0d6;
  --danger:#a32424; --danger-bg:#fdeaea;
  --on-fill:#fff; --radius-sm:8px;
 }
 *{box-sizing:border-box}
 html,body{height:100%}
 body{
  margin:0; display:flex; align-items:center; justify-content:center;
  color:var(--pale);
  background:
   radial-gradient(120% 90% at 12% -10%, color-mix(in srgb, var(--teal) 10%, transparent), transparent 58%),
   radial-gradient(90% 80% at 108% 108%, color-mix(in srgb, var(--warn) 6%, transparent), transparent 55%),
   linear-gradient(158deg,
    color-mix(in srgb, var(--nav) 60%, black) 0%,
    color-mix(in srgb, var(--nav) 88%, black) 46%,
    color-mix(in srgb, var(--nav) 48%, black) 100%);
  font-family:"Yu Gothic UI","Meiryo","Segoe UI",system-ui,sans-serif;
  font-size:14px; line-height:1.6;
 }
 .card{width:min(94vw,880px);display:grid;grid-template-columns:5fr 6fr;border-radius:18px;overflow:hidden;background:#fff;
  box-shadow:0 18px 48px rgba(23,39,45,.20)}
 .brand{position:relative;overflow:hidden;color:#fff;display:grid;align-content:space-between;gap:32px;padding:40px 32px;
  background:linear-gradient(160deg,var(--teal),var(--nav))}
 .brand>*{position:relative;z-index:2}
 .logo{width:64px;height:64px;display:block}
 .brand h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.04em;line-height:1.3}
 .brand p{margin:4px 0 0;font-size:12px;color:var(--pale)}
 .brand small{font-size:12px;color:var(--teal-soft)}
 .ring{position:absolute;z-index:0;left:64px;top:72px;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;
  border:1.5px solid var(--teal-soft);opacity:0;pointer-events:none;animation:ripple 4.6s linear infinite;animation-delay:var(--d,0s)}
 @keyframes ripple{0%{width:34px;height:34px;opacity:0}4%{opacity:.32}30%{opacity:.15}100%{width:1080px;height:1080px;opacity:0}}
 .body{display:grid;align-content:center;gap:16px;padding:40px 32px;color:var(--ink);max-height:94vh;overflow:auto}
 .body h2{margin:0;font-size:20px;font-weight:700}
 /* 見出しと版の行（§9.606）。更新の途中だけ見出しの左に向きの印を出し、版の行は印の右（見出しの字の左端）にそろえる。
    版の行は最初から1行ぶんの高さを取っておく（出入りで下の段が跳ねない）。 */
 /* 列は段の一覧と同じ（印 22px＋12px）——見出しの字・版の行・段の名前の左端が1本にそろう。印は地を持たない字の印
    （押せる丸に見せない）。 */
 .head{display:grid;grid-template-columns:22px 1fr;column-gap:12px;align-items:center}
 .head h2,.head .verline{grid-column:2}
 .tdir{grid-row:1;grid-column:1;justify-self:center;font-size:20px;font-weight:700;line-height:1;color:var(--teal-ink)}
 body[data-update=down] .tdir{color:var(--ink-2)}
 .verline{margin:4px 0 0;min-height:22px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
 .vchip{padding:0 8px;border-radius:var(--radius-sm);border:1px solid var(--line);font-weight:600;white-space:nowrap}
 .vchip small{margin-right:4px;font-size:12px;font-weight:600;color:var(--muted)}
 .vchip.to{background:var(--teal);border-color:var(--teal);color:var(--on-fill)}
 body[data-update=down] .vchip.to{background:var(--ink-2);border-color:var(--ink-2)}
 ol{list-style:none;margin:0;padding:0;display:grid;gap:12px}
 li{display:grid;grid-template-columns:22px 1fr;column-gap:12px;align-items:center;color:var(--muted)}
 li b{font-weight:600}
 .mark{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;
  font-size:11px;font-weight:700;color:#fff}
 .d{grid-column:2;display:none;font-size:12px;color:var(--ink-2);word-break:break-all}
 li.ok,li.now,li.warn,li.bad{color:var(--ink)}
 li.now b{font-weight:700}
 li.now .d,li.warn .d,li.bad .d{display:block}
 li.now .mark{border-color:var(--teal);border-top-color:transparent;animation:spin .9s linear infinite}
 li.ok .mark{background:var(--teal);border-color:var(--teal)}
 li.ok .mark::after{content:"✓"}
 li.warn .mark{background:var(--warn);border-color:var(--warn);color:var(--warn-fg)}
 li.warn .mark::after{content:"!"}
 li.warn .d{color:var(--warn-fg)}
 li.bad .mark{background:var(--danger);border-color:var(--danger)}
 li.bad .mark::after{content:"×"}
 @keyframes spin{to{transform:rotate(360deg)}}
 @media (prefers-reduced-motion:reduce){li.now .mark,.ring{animation:none}}
 .bar{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin-top:4px}
 .bar i{display:block;height:100%;width:var(--pct,0%);border-radius:999px;background:linear-gradient(90deg,var(--teal-dark),var(--teal));
  transition:width .45s cubic-bezier(.25,.8,.3,1)}
 .meta{display:flex;justify-content:space-between;margin:-8px 0 0;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
 .meta b{color:var(--teal-ink)}
 .fail{padding:12px 14px;border-radius:10px;background:var(--danger-bg);color:var(--danger);font-size:12.5px;line-height:1.7}
 .fail pre{white-space:pre-wrap;margin:6px 0 0;font:12px Consolas,monospace;max-height:220px;overflow:auto;color:var(--ink)}
 .hidden{display:none}
 @media (max-width:720px){.card{grid-template-columns:1fr}.brand{grid-template-columns:auto 1fr;align-items:center;padding:20px 24px}.brand small{display:none}}
</style>
</head>
<body>
<section class="card" aria-labelledby="title">
  <div class="brand"><i class="ring" style="--d:0s"></i><i class="ring" style="--d:1.53s"></i><i class="ring" style="--d:3.06s"></i>
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="13" fill="#eaf3f4" stroke="#bcd8db" stroke-width="2"/><rect x="10" y="12" width="44" height="40" rx="6" fill="#fff" stroke="#087c89" stroke-width="3.5"/><path d="M10 23h44" stroke="#087c89" stroke-width="3.5"/><path d="M22 12v-4M42 12v-4" stroke="#096b75" stroke-width="4" stroke-linecap="round"/><path d="M17 41c5-10 8 5 12-4s7 7 11-2" fill="none" stroke="#096b75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="46" cy="33" r="4.5" fill="#f5a30a"/></svg>
    <div><h1>測定伝送システム</h1><p>測定・作業予定・帳票をひとつに</p></div>
    <small>デスクトップ版</small></div>
  <div class="body">
    <div class="head"><span class="tdir" id="tdir" aria-hidden="true"></span><h2 id="title">起動しています</h2>
      <p class="verline" id="verline" data-splash-say></p></div>
    <ol>
      <li class="now" id="p-update"><span class="mark"></span><b>版をそろえる</b><span class="d">配る版と同じか確かめています</span></li>
      <li class="wait" id="p-app"><span class="mark"></span><b>アプリを起こす</b><span class="d">データの置き場につないでいます</span></li>
      <li class="wait" id="p-screen"><span class="mark"></span><b>画面を組み立てる</b><span class="d">一覧と権限を読み込んでいます</span></li>
      <li class="wait" id="p-ready"><span class="mark"></span><b>準備完了</b><span class="d">まもなく開きます</span></li>
    </ol>
    <div class="fail hidden" id="fail" role="alert"></div>
    <div class="bar" id="bar"><i></i></div>
    <p class="meta"><b id="pct">0%</b><span id="elapsed">経過 0.0 秒</span></p>
  </div>
</section>
<script>
(() => {
  const t0 = performance.now();
  const $ = (s) => document.querySelector(s);
  const sec = () => ((performance.now() - t0) / 1000).toFixed(1);
  const timer = setInterval(() => { $("#elapsed").textContent = "経過 " + sec() + " 秒"; }, 100);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  /* 窓の段 → 見せる段（§9.580）。last はその段を締める窓の段（python が済んでも「アプリを起こす」はまだ続く）。 */
  const PHASE = { update: "update", python: "app", backend: "app", open: "screen" };
  const LAST = { update: true, python: false, backend: true, open: false };
  /* 窓の細かな字を画面に出してよい段。python・backend の字は Python の場所や中身の名前を言うので、段の title に
     だけ残し、画面は段の一言のまま（技術の言葉を出さない）。注意（warn）と失敗（bad）はどの段でも字を出す。 */
  const SAY = { update: true, python: false, backend: false, open: true };
  const ORDER = ["update", "app", "screen", "ready"];
  /* 済んだ段までの進み具合。覆い（#appBoot）は中身の起動の6段を済みとして60%から引き継ぐので、
     「アプリを起こす」が済んだ時点で60%にそろえる（切り替わっても棒が戻らない）。版の段の中（写している間）は 2〜19%。 */
  const PCT = { update: 20, app: 60 };
  const UPDATE_PCT = 40;   /* 版を写して入れ替えるときの版の段の取り分（写すぶん長い・§9.606） */
  /* よくある理由 → 次にすること（理由の文から見分ける。当てはまらなければ理由だけ出す） */
  const HINTS = [
    [/No module named '?flask/i, "Python に Flask が入っていません。ネットにつながる状態で開き直すと自動で入れます。つながらない PC では、コマンドプロンプトで python -m pip install flask を実行してから開き直してください。"],
    [/No module named/i, "Python に必要な部品が入っていません。ネットにつながる状態で開き直すと自動で入れます。直らなければ管理者に連絡してください。"],
    [/Python が見つかりません/, "Python を入れて PATH に通してから、開き直してください。分からなければ管理者に連絡してください。"],
    [/program フォルダ|sidecar\.py/, "デスクトップの起動アイコンか、配られた共有の入口（共有の置き場の WaveLog.exe）から起動してください（exe だけではアプリの中身の場所が分かりません）。"],
    [/この PC へアプリを写せません|写す先を作れません/, "共有の置き場に届くか、この PC のユーザーのフォルダ（%USERPROFILE%\\WaveLog）に書けるかを確かめてから、もう一度入口を開いてください。"],
    [/版が食い違/, "アプリが更新されています。この窓を閉じて、デスクトップの起動アイコンから開き直してください。"],
    [/秒たっても準備できません/, "PC が混んでいるか、共有フォルダへの接続で止まっています。少し待ってから開き直してください。"],
  ];
  const row = (k) => $("#p-" + k);
  /* ---------- 段は順に1つずつ（§9.606、利用者の指示「同時に2つぐるぐる・手戻りに見える動きを、秩序の見える表示に」） ----------
     窓は版の確かめと Python の起動を**同時に**進める（§9.561）。来た順に塗ると、済んだ段が回り直し・2つの段が同時に回り・
     帯が下がっていた。ここでは**いまの段（cur）だけを塗り**、後の段の知らせは控えて（pending）、前の段が済んだら当てる。
     済んだ段へ後から来た知らせは塗らない（title にだけ残す）。帯は下げない。 */
  let cur = 0, pct = 0, after = null;          /* after: 更新を済ませた（新しい版で起こす）ときの字 */
  const pending = {};
  const paintPct = (p) => { pct = Math.max(pct, Math.round(p)); $("#bar").style.setProperty("--pct", pct + "%"); $("#pct").textContent = pct + "%"; };
  function paintRow(k, state, detail, say) {
    const li = row(k);
    if (li.className !== "warn" || state === "bad") li.className = state;
    if (detail) { li.title = detail; if (say || /^(warn|bad)$/.test(state)) li.querySelector(".d").textContent = detail; }
  }
  /* 段 k を済ませて次の段へ。控えていた知らせがあれば当て、それも済んでいればさらに進む。 */
  function finish(k, state, detail, say) {
    paintRow(k, state, detail, say);
    paintPct(PCT[k] || 0);
    cur = ORDER.indexOf(k) + 1;
    const nk = ORDER[cur]; if (!nk) return;
    const nli = row(nk); nli.className = "now";
    if (nk === "app" && after) nli.querySelector(".d").textContent = after;
    const p = pending[nk]; delete pending[nk];
    if (p) take(p.id, p.state, p.detail);
  }
  function take(id, state, detail) {
    const k = PHASE[id]; const i = ORDER.indexOf(k); if (i < 0) return;
    if (i > cur && state === "bad") return paintRow(k, "bad", detail, SAY[id]);   /* 失敗は待たせず、その段に出す */
    if (i > cur) { if (!(pending[k] && pending[k].done)) pending[k] = { id, state, detail, done: state === "ok" && LAST[id] }; return; }
    if (i < cur) { if (detail) row(k).title = detail; return; }
    if (state === "ok" && LAST[id]) return finish(k, "ok", detail, SAY[id]);
    paintRow(k, state === "ok" ? "now" : state, detail, SAY[id]);
  }
  /* ---------- 版の段（§9.606）: 確かめる → 同じ／新しい版へ更新する／前の版へ戻す ----------
     窓は版の段だけ形のある知らせ（phase・前後の版・向き・写した数）で送る。字はここ1箇所が決める。
     5案×2回を別の採点者が採点して選んだ形（r2・96点）: **向きは見出しだけが言う**（丸い ↑／↓ の印＋字。戻すときは印と
     新しい版の札が灰）、見出しの下の版の行は**最初から高さを取っておく**（行が出入りして段が跳ねない）、段の名前は向きと
     関係のない「版をそろえる」、写した数は帯の右の1箇所（% と2つの数を並べない）。 */
  const WORD = { up: { title: "新しい版へ更新しています", icon: "↑", done: "更新しました", fail: "更新できませんでした" },
                 down: { title: "前の版へ戻しています", icon: "↓", done: "戻しました", fail: "戻せませんでした" } };
  const DOING = { found: "準備しています", copy: "ファイルを写しています", swap: "入れ替えています", relaunch: "新しい窓で開き直します…" };
  const chips = (v) => '<span class="vchip"><small>いま</small>' + esc(v.have) + '</span><span aria-hidden="true">→</span><span class="vchip to">' + esc(v.want) + "</span>";
  function head(v) {                               /* 見出し（向き）と版の行。更新の途中だけ向きを言う */
    const w = WORD[v.dir] || WORD.up, busy = !!DOING[v.phase] && !!v.dir;
    document.body.dataset.update = busy ? v.dir : "";
    $("#tdir").textContent = busy ? w.icon : "";
    $("#title").textContent = busy ? w.title : "起動しています";
    if (busy) $("#verline").innerHTML = chips(v);
  }
  function version(v) {
    const k = "update", w = WORD[v.dir] || WORD.up;
    if (ORDER.indexOf(k) < cur) return;           /* 済んだ版の段へ後から来た答え（開き直した窓の確かめ）は塗らない */
    head(v);
    switch (v.phase) {
      case "check": return paintRow(k, "now", "配る版と同じか確かめています", true);
      case "install": return paintRow(k, "now", "初めての起動です。共有の置き場からこの PC へアプリを写しています" + (v.total ? " " + v.done + "/" + v.total : ""), true);
      case "same": $("#verline").textContent = v.have ? "いまの版 " + v.have : "";
        return finish(k, "ok", "配る版と同じです", true);
      case "skip": return finish(k, "ok", "確かめませんでした（" + v.why + "）。いまの版で起動します", true);
      case "bad": return finish(k, "warn", "版を確かめられませんでした（" + v.why + "）。いまの版で起動します", true);
      case "found": delete pending.app;           /* 止める前の Python の知らせを新しい版の起動へ持ち越さない */
        PCT.update = UPDATE_PCT;                   /* 写すぶん長くかかるので、版の段に帯の 0〜40% を配る */
        paintPct(2); return paintRow(k, "now", DOING.found, true);
      case "copy": paintPct(2 + (UPDATE_PCT - 4) * Math.min(1, (v.done || 0) / (v.total || 1)));
        /* 写した数は段の説明に（帯の右は全体の % のまま・帯と字の物差しを1つにする）。 */
        return paintRow(k, "now", DOING.copy + " " + v.done + "/" + v.total, true);
      case "swap": paintPct(UPDATE_PCT - 2); return paintRow(k, "now", DOING.swap, true);
      case "relaunch": paintPct(UPDATE_PCT - 1); return paintRow(k, "now", v.want + " へ" + w.done + "。" + DOING.relaunch, true);
      case "done":
        if (v.want) { after = "新しい版 " + v.want + " で起こしています"; $("#verline").textContent = "いまの版 " + v.want + "（" + v.have + " から" + w.done.replace("しました", "") + "）"; }
        return finish(k, "ok", v.want ? v.want + " へ" + w.done + (v.relaunched ? "（窓も新しくなりました）" : "") : "この PC へ入れました", true);
      case "fail":
        return finish(k, "warn", (v.want ? w.fail : "そろえられませんでした") + "（" + v.why + "）。いまの版" + (v.have ? " " + v.have : "") + " で起動します", true);
    }
  }
  window.splash = {
    step: take,
    version,
    fail(title, detail) {
      clearInterval(timer);
      $("#elapsed").textContent = "経過 " + sec() + " 秒";
      $("#title").textContent = title;
      /* 止まった段だけ ×。後の段の失敗（Python が見つからない等）が先に来たら、回っていた前の段は「まだ」へ戻さず止める。 */
      const failed = document.querySelector("li.bad");
      document.querySelectorAll("li.now").forEach((li) => (li.className = failed ? "wait" : "bad"));
      const hint = HINTS.find(([re]) => re.test(detail));
      const box = $("#fail");
      box.innerHTML = (hint ? "<b>次にすること</b><div>" + hint[1] + "</div>" : "<b>直したら、この窓を閉じて起動アイコンから開き直してください。</b>") + "<b>理由</b><pre>" + esc(detail) + "</pre>";
      box.classList.remove("hidden");
    },
  };
})();
</script>
</body>
</html>
