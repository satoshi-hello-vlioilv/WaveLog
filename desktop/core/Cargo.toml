[package]
name = "wavelog-core"
version = "0.1.0"
description = "WaveLog の業務（Python から Rust へ移す先・docs/RUST_MIGRATION_PLAN.md）。窓（Tauri）も Windows も知らない"
edition = "2021"
rust-version = "1.90"
publish = false

[features]
# 開発と網のための HTTP の入口（bin/serve.rs）。窓の exe には入れない
serve = ["dep:tiny_http"]

[dependencies]
serde_json = "1"
# 日時の読み方の型（datetext・§9.634）。Tauri が既に使っている版
regex = "1"
# 字の正規化（NFKC）と大文字・小文字の畳み方（casefold）。Python の unicodedata.normalize・str.casefold と同じ答えにする
unicode-normalization = "0.1"
caseless = "0.2"
# 利用者が書いた正規表現の照合（表示ルール・ダッシュボードの式・§9.635）。後読み・後方参照も読む
fancy-regex = "0.20"
tiny_http = { version = "0.12", optional = true }

[[bin]]
name = "wavelog-serve"
path = "src/bin/serve.rs"
required-features = ["serve"]
