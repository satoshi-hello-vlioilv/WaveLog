[package]
name = "wavelog-desktop"
version = "1.0.0"
description = "測定伝送システム（WaveLog）デスクトップ版の窓"
edition = "2021"
rust-version = "1.90"
publish = false

[[bin]]
name = "WaveLog"
path = "src/main.rs"

[features]
# 起動画面を exe に埋め込む本番の形。外すと Tauri の開発の形になる
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 更新で写した物を確かめる（src/update.rs・§9.555）。Tauri が既に使っている版
sha2 = "0.10"

# ショートカット（.lnk）を Windows の部品（IShellLinkW）で直に作る・読む（src/lnk.rs・§9.552）。
# 版は Tauri が使っているものに合わせる（同じ crate を2つ持たない）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_RestartManager"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
