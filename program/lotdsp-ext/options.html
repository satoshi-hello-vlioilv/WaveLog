<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ロット問い合わせのログイン（WaveLog）</title>
<style>
  body{margin:0;padding:24px;font:14px/1.6 "Segoe UI","Yu Gothic UI",Meiryo,sans-serif;color:#0f2f3a;background:#f4f7f8}
  main{max-width:560px;margin:0 auto;background:#fff;border:1px solid #d5dee2;border-radius:8px;padding:20px 24px}
  h1{font-size:18px;margin:0 0 4px}
  .lead{color:#475569;margin:0 0 16px}
  .now{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;background:#eef2f4}
  .now.is-on{background:#e6f4f3;color:#0f766e}
  .row{display:grid;grid-template-columns:8em 1fr;gap:10px 12px;align-items:center;margin:16px 0}
  input{height:32px;padding:0 10px;border:1px solid #94a3b8;border-radius:4px;font:inherit}
  .hint{grid-column:2;color:#64748b;font-size:12px;margin-top:-6px}
  .acts{display:flex;gap:10px;align-items:center;margin-top:8px}
  button{height:34px;padding:0 16px;border-radius:4px;font:inherit;cursor:pointer;border:1px solid #0f766e;background:#fff;color:#0f766e}
  button.p{background:#0f766e;color:#fff;font-weight:700}
  button.d{border-color:#b42318;color:#b42318}
  .sp{flex:1}
  #msg{min-height:1.6em;margin-top:10px;font-weight:700}
  #msg.ng{color:#b42318} #msg.ok{color:#0f766e}
  .where{margin-top:18px;padding-top:12px;border-top:1px solid #e2e8f0;color:#475569;font-size:12px}
</style>
</head>
<body>
<main>
  <h1>ロット問い合わせのログイン（VPN のとき）</h1>
  <p class="lead">ロット問い合わせでログイン画面が出たら、ここに登録した ID・パスワードで自動でログインします。</p>
  <div>いま: <span class="now" id="now">読み込んでいます…</span></div>
  <div class="row">
    <label for="u">ユーザーID</label><input id="u" autocomplete="off">
    <label for="p">パスワード</label><input id="p" type="password" autocomplete="off">
    <div class="hint" id="pHint">パスワードを変えないときは空のままにします。</div>
  </div>
  <div class="acts">
    <button type="button" class="p" id="save">保存</button>
    <span class="sp"></span>
    <button type="button" class="d" id="del">登録を消す</button>
  </div>
  <div id="msg" role="status"></div>
  <p class="where">保存先: Edge のこの PC・この Windows ユーザーの領域（他の PC とは同期しません。WaveLog 本体へも渡しません）。
    Edge のパスワード保存と違い Windows のログオンでの暗号化はされないため、この PC を同じ Windows アカウントで使える人には読めます。</p>
</main>
<script src="store.js"></script>
<script src="options.js"></script>
</body>
</html>
