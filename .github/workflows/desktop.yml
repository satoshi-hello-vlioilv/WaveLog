# デスクトップ版（desktop/・Tauri）を Windows で作り、本物の WebView2 で自己診断する（§9.544）。
#
# 1. Python の網を Windows で回す（窓口の枠・fd の向け直しは OS で振る舞いが違いうる）
#      test_portdep（共有の層は画面のポートを知らない）・test_terminalstore（端末の控え）・
#      test_sidecar（窓口の答えがポートの版と同じ・閉じたら片付けて終わる）・
#      test_shortcut（ショートカットの判断・短い名前と長い名前を同じ場所と見る・§9.552）
# 2. cargo test → cargo build --release
# 3. 作った exe を program/ に置いて起こす（手元へ写して起動する道そのものを通す・§9.548・§9.554）。
#    3回目は**共有の配る入口から初めての PC へ入れる道**（§9.559）。窓は WAVELOG_SELFTEST に結果を書いて終わる。
#    結果と exe は Artifacts に置く。
#
# 4. **main への push では、通った exe を program/WaveLog.exe として main へ置く**（publish・§9.548）。
#    現場は main の ZIP を落として上書きするので、exe も同じ ZIP で届く（exe と Python の組がずれない）。
#    置くのは「窓の元（desktop/・app_icon.py）が前に置いた exe と違う」ときだけ（program/WaveLog.build.json の指紋）。
#
# 全件の網はここでは回さない（nets.yml と同じ方針・CLAUDE.md の A）。
name: desktop

on:
  push:
    branches: [main]
    paths: ["desktop/**", "program/**", "backend/**", "static/**", "templates/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "program/**", "backend/**", "static/**", "templates/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

# main へ続けて入っても、置くのは1本ずつ（後から来たほうが待つ）。
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONIOENCODING: utf-8
      # exe が名乗る「作ったコミット」（§9.552）。publish が WaveLog.build.json に書く commit と同じ値
      WAVELOG_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python の部品
        run: python -m pip install -r program/requirements.txt

      - name: Python の網（Windows）
        run: |
          $ng = 0
          foreach ($t in "test_portdep", "test_terminalstore", "test_sidecar", "test_shortcut") {
            Write-Host "=== $t"
            python "tests/$t.py"
            if ($LASTEXITCODE -ne 0) { $ng++ }
          }
          exit $ng

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Rust の網
        working-directory: desktop
        env:
          WAVELOG_PYTHON: python
        run: cargo test --locked

      - name: exe を作る
        working-directory: desktop
        env:
          WAVELOG_PYTHON: python
        run: cargo build --release --locked

      # 入口の道（§9.554・§9.559）を3回たどる。
      #   1回目: アプリのフォルダの program\WaveLog.exe を直に起こす。ZIP で届いた物と同じ「インターネットから来た」
      #          印を付けておき、exe が版ごとの写しと入口を置いて、**どちらからも印を外した**ことを確かめる。
      #   2回目: 入口（この PC の exe・起動アイコンの行き先）から。入口が写しへ渡す（毎日の道）。
      #   3回目: 共有の置き場の配る入口から、**まだアプリの無い PC**へ（§9.559）。置き場は本物の道（publish_zip・set_release）
      #          で作り、写す先は WAVELOG_INSTALL_ROOT。写した中身で起動し、入口・置き場の控えが置かれたことを確かめる。
      # 起こすのは呼び出し（CreateProcess）なので、印があっても実行前の警告は出ない（警告はエクスプローラー・WSH の道）。
      - name: 自己診断（本物の WebView2・ポートなし・入口の道を3回）
        run: |
          Copy-Item desktop\target\release\WaveLog.exe program\WaveLog.exe
          Set-Content -Path program\WaveLog.exe -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          $dir = "$env:LOCALAPPDATA\WaveLog\desktop"
          function Run-Selftest($label, [scriptblock]$start) {
            $out = "$env:RUNNER_TEMP\selftest-$label.json"
            $env:WAVELOG_SELFTEST = $out
            & $start
            $deadline = (Get-Date).AddSeconds(240)
            while (-not (Test-Path $out) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
            Wait-Process -Name WaveLog -Timeout 30 -ErrorAction SilentlyContinue
            if (-not (Test-Path $out)) { Write-Host "[$label] 結果のファイルがありません"; return $null }
            $r = Get-Content $out -Raw -Encoding utf8 | ConvertFrom-Json
            $r.results | ForEach-Object { Write-Host ("[{0}] {1}: {2} -- {3}" -f $label, ($(if ($_.ok) { "PASS" } else { "FAIL" })), $_.name, $_.info) }
            if ($r.error) { Write-Host "[$label] ERROR: $($r.error)" }
            return $r
          }
          $r1 = Run-Selftest "share" { & .\program\WaveLog.exe }
          $copies = Get-ChildItem $dir -Recurse -Filter WaveLog.exe -ErrorAction SilentlyContinue
          Write-Host "この PC へ写した exe: $($copies.FullName -join ', ')"
          $marked = $copies | Where-Object { Get-Item $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue }
          $r2 = Run-Selftest "entry" { & "$dir\WaveLog.exe" --program "$PWD\program" }
          # 3回目: 共有の配る入口から、まだアプリの無い PC へ（前の2回が控えた program フォルダは消しておく）
          $share = "$env:RUNNER_TEMP\share"
          $env:WAVELOG_INSTALL_ROOT = "$env:RUNNER_TEMP\home\WaveLog"
          python tests\lib\make_share.py $share
          if ($LASTEXITCODE -ne 0) { Write-Host "共有の置き場を作れませんでした"; exit 7 }
          Remove-Item "$dir\program.txt" -ErrorAction SilentlyContinue
          $r3 = Run-Selftest "install" { & "$share\WaveLog.exe" }
          Get-ChildItem "$env:LOCALAPPDATA\WaveLog\logs" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 25 -Encoding utf8 }
          if (-not $r1 -or -not $r2 -or -not $r3) { exit 2 }
          if (-not (Test-Path "$env:WAVELOG_INSTALL_ROOT\program\sidecar.py")) { Write-Host "共有の入口から写していません（$env:WAVELOG_INSTALL_ROOT）"; exit 8 }
          if (-not (Test-Path "$env:WAVELOG_INSTALL_ROOT\config\update.json")) { Write-Host "置き場の控え（config\update.json）がありません"; exit 8 }
          if ($r3.program -and $r3.program -notlike "$env:WAVELOG_INSTALL_ROOT*") { Write-Host "写した中身で起動していません: $($r3.program)"; exit 8 }
          if (-not (Test-Path "$dir\WaveLog.exe")) { Write-Host "入口（$dir\WaveLog.exe）が置かれていません"; exit 3 }
          if (-not ($copies | Where-Object { $_.Directory.FullName -ne $dir })) { Write-Host "版ごとの写しがありません"; exit 3 }
          if ($marked) { Write-Host "印が残っている写し: $($marked.FullName -join ', ')"; exit 5 }
          if (-not (Get-Item program\WaveLog.exe -Stream Zone.Identifier -ErrorAction SilentlyContinue)) { Write-Host "配った exe の印まで消えています（触らない約束）"; exit 6 }
          if (Get-Process python -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "*hostedtoolcache*" }) { Write-Host "Python が残っています（窓を閉じても中身が終わっていない）"; exit 4 }
          if (-not $r1.ok -or -not $r2.ok -or -not $r3.ok) { exit 1 }
          Copy-Item "$env:RUNNER_TEMP\selftest-entry.json" "$env:RUNNER_TEMP\selftest.json"

      # 置く物をまとめる: exe・自己診断の結果・**作った元の指紋**（publish が比べる）。
      - name: 成果物をまとめる
        if: always()
        run: |
          $out = "$env:RUNNER_TEMP\out"
          New-Item -ItemType Directory -Force $out | Out-Null
          if (Test-Path desktop\target\release\WaveLog.exe) { Copy-Item desktop\target\release\WaveLog.exe $out }
          if (Test-Path "$env:RUNNER_TEMP\selftest.json") { Copy-Item "$env:RUNNER_TEMP\selftest.json" $out }
          "desktop:$(git rev-parse HEAD:desktop) icon:$(git rev-parse HEAD:backend/app_icon.py)" | Set-Content -NoNewline -Encoding ascii "$out\source.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WaveLog-desktop-windows
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn

  # main へ入ったときだけ、通った exe を main へ置く（§9.548）。書く権限はこの段だけが持つ。
  publish:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: WaveLog-desktop-windows
          path: built
      - name: exe を main へ置く
        env:
          BUILT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          built="$(cat built/source.txt)"
          now="desktop:$(git rev-parse HEAD:desktop) icon:$(git rev-parse HEAD:backend/app_icon.py)"
          # 作っているあいだに窓の元が変わった——古い exe で上書きしない（後の版が置く）。
          if [ "$built" != "$now" ]; then echo "窓の元が作った後に変わったので置かない（後の版が置く）"; exit 0; fi
          have="$(python3 -c "import json;print(json.load(open('program/WaveLog.build.json',encoding='utf-8'))['source'])" 2>/dev/null || true)"
          if [ "$have" = "$now" ] && [ -f program/WaveLog.exe ]; then echo "同じ元から作った exe がもう置いてある"; exit 0; fi
          python3 - "$now" "$BUILT_SHA" <<'PY'
          import json, re, sys, datetime, pathlib, shutil
          src, sha = sys.argv[1], sys.argv[2]
          shutil.copyfile('built/WaveLog.exe', 'program/WaveLog.exe')
          st = json.load(open('built/selftest.json', encoding='utf-8'))
          ver = re.search(r"APP_VERSION='([^']+)'", open('backend/changelog_data.py', encoding='utf-8').read()).group(1)
          info = {'source': src, 'commit': sha, 'version': ver,
                  'builtAt': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
                  'size': pathlib.Path('program/WaveLog.exe').stat().st_size,
                  'selftest': f"{sum(r['ok'] for r in st['results'])}/{len(st['results'])}"}
          pathlib.Path('program/WaveLog.build.json').write_text(json.dumps(info, ensure_ascii=False, indent=1) + '\n', encoding='utf-8')
          print(info)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add program/WaveLog.exe program/WaveLog.build.json
          git commit -m "デスクトップ版の exe を置く（${BUILT_SHA:0:7} から作った・自己診断を通った物・§9.548）[skip ci]"
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            sleep $((2 ** i)); git pull --rebase origin main
          done
          exit 1
