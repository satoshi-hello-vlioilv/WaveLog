<!doctype html>
<!-- ロット問い合わせ（LotDsp）のログイン画面の見本（§9.485・test_lotdspext.js）。
     利用者のスクリーンショット（開発者ツール）と同じ形: #input_userId／#input_password（ng-model）・
     button.lotdspBtnCustom[ng-click="action.login()"]。**本物の AngularJS の代わり**に、入力の合図
     （input）で値を読む小さな model を置く——値を直に書いただけの入れ方では空のまま送られることを
     見分けるため。`?loggedin=1`はログイン済みの画面（欄が伏せてある）。 -->
<html lang="ja"><head><meta charset="utf-8"><title>ロット問合せ（見本）</title></head>
<body>
<button type="button" id="lotTitle">ロット問合せ</button>
<table id="form1:gridPanel_Menu" border="1" style="background-color:white;width:300px"><tbody>
 <tr><td>★ ログインすることで全てのタブが表示されます</td></tr>
 <tr id="loginRow" ng-show="util.showLogin()"><td>
  <table id="form1:gridPanel_Menu4"><tbody>
   <tr><td class="menu-body-label">ユーザーID :</td>
       <td class=" menu-body-input"><input type="text" ng-model="input.userId" id="input_userId" name="userId" style="height:20px;width:110px"></td></tr>
   <tr><td class="menu-body-label">パスワード :</td>
       <td class=" menu-body-input"><input type="password" ng-model="input.password" id="input_password" name="password" style="height:20px;width:110px"></td></tr>
  </tbody></table>
 </td></tr>
 <tr id="btnRow"><td><button type="submit" class="btn btn-default btnCustom lotdspBtnCustom" ng-click="action.login()">ログイン </button></td></tr>
</tbody></table>
<div id="result" hidden>ロット検索結果</div>
<script>
 const model = { userId: '', password: '' };
 window.__fake = { model, clicks: 0, sent: [] };
 const rows = on => ['loginRow', 'btnRow'].forEach(id => { document.getElementById(id).style.display = on ? '' : 'none'; });
 if (/loggedin=1/.test(location.search)) { rows(false); document.getElementById('result').hidden = false; }
 document.getElementById('input_userId').addEventListener('input', e => { model.userId = e.target.value; });
 document.getElementById('input_password').addEventListener('input', e => { model.password = e.target.value; });
 document.querySelector('button.lotdspBtnCustom').addEventListener('click', e => {
   e.preventDefault();
   __fake.clicks++;
   __fake.sent.push({ userId: model.userId, password: model.password });
   if (model.userId === 'wl-user' && model.password === 'p@ss w0rd') {
     rows(false); document.getElementById('result').hidden = false;
   }
 });
</script>
</body></html>
